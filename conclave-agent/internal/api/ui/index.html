<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>conclave agent</title>
  <style>
    :root {
      --bg: #0a0c11; --bg-soft: #0e1219; --panel: #121722; --panel-2: #171d2b; --panel-3: #1d2534;
      --border: #252d3d; --border-2: #313b50; --text: #e9ecf4; --muted: #8b93a8; --muted-2: #616a80;
      --accent: #7c8cff; --accent-2: #9d7bff; --ok: #3ddc97; --err: #ff6b6b; --warn: #f5b955;
      --radius: 8px; --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column; height: 100vh;
      background: radial-gradient(1200px 700px at 80% -10%, #182035 0%, var(--bg) 55%);
      color: var(--text); font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #2a3242; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #39445a; background-clip: padding-box; }

    header { display: flex; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border);
      background: rgba(14,18,25,.8); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; }
    header .brand { font-weight: 800; letter-spacing: .2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .stat { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted-2); }
    .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.err { background: var(--err); box-shadow: 0 0 8px var(--err); }

    .layout { flex: 1; display: flex; min-height: 0; }

    aside { width: 300px; border-right: 1px solid var(--border); background: var(--bg-soft); display: flex; flex-direction: column; min-height: 0; }
    aside .pad { padding: 12px; border-bottom: 1px solid var(--border); }
    .sessions { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .session { padding: 11px 12px; border-radius: var(--radius); cursor: pointer; border: 1px solid var(--border); background: var(--panel);
      transition: border-color .15s, transform .1s, background .15s; }
    .session:hover { border-color: var(--border-2); transform: translateY(-1px); }
    .session.active { border-color: var(--accent); background: linear-gradient(180deg, #1a2136, var(--panel)); }
    .session .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .session .title-row { display: flex; align-items: center; gap: 6px; }
    .session .del { flex: 0 0 auto; width: 26px; height: 26px; padding: 0; border: none; background: none;
      color: var(--muted-2); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }
    .session .del svg { display: block; }
    .session .del:hover { color: var(--err); background: var(--panel-3); }
    .session .sub { font-size: 11px; color: var(--muted); display: flex; gap: 6px; margin-top: 4px; align-items: center; }
    .badge { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border-2); color: var(--muted); }
    .badge.active, .badge.running { color: var(--accent); border-color: rgba(124,140,255,.5); }
    .badge.done { color: var(--ok); border-color: rgba(61,220,151,.4); }
    .badge.failed, .badge.cancelled { color: var(--err); border-color: rgba(255,107,107,.4); }
    .badge.waiting_user, .badge.review, .badge.pending { color: var(--warn); border-color: rgba(245,185,85,.4); }

    main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    /* plan graph */
    #plan { display: none; border-bottom: 1px solid var(--border); background: rgba(18,23,34,.55); }
    .plan-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .plan-head .spacer { flex: 1; }
    .plan-head button { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
    .graph-wrap { overflow: auto; max-height: 460px; min-height: 200px; }
    .graph-wrap svg { display: block; cursor: grab; }
    .graph-wrap svg:active { cursor: grabbing; }
    .node circle.body { fill: var(--panel-2); stroke: var(--border-2); stroke-width: 2; }
    .node text.k { fill: var(--text); font: 600 12px ui-monospace, Menlo, monospace; text-anchor: middle; }
    .node text.s { fill: var(--muted); font: 10px ui-sans-serif, system-ui; text-anchor: middle; }
    .node.running circle.body { stroke: var(--accent); }
    .node.done circle.body { stroke: var(--ok); }
    .node.failed circle.body { stroke: var(--err); }
    .node.waiting_user circle.body, .node.review circle.body { stroke: var(--warn); }
    .node.focus circle.body { stroke-width: 3; filter: drop-shadow(0 0 10px rgba(124,140,255,.6)); }
    .node .spin { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 12 10; transform-box: fill-box; transform-origin: center; }
    .node.running .spin { animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .edge { fill: none; stroke: var(--border-2); stroke-width: 1.6; }
    .edge.data { stroke: #42557c; stroke-dasharray: 5 4; }
    .edge.hot { stroke: var(--accent); }
    .node-details { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12px; }
    .node-details pre { margin: 6px 0 0; max-height: 180px; overflow: auto; }

    /* timeline */
    #timeline { flex: 1; overflow-y: auto; padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 14px; }
    .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
    .entry { display: flex; flex-direction: column; gap: 4px; max-width: 900px; }
    .entry .meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
    .entry .meta .pill { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: var(--panel-3); color: var(--muted); }
    .bubble { border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 14px; background: var(--panel); box-shadow: var(--shadow); }
    .entry.assistant .bubble { border-left: 3px solid var(--accent); }
    .entry.user { align-self: flex-end; align-items: flex-end; }
    .entry.user .bubble { border-right: 3px solid var(--warn); background: linear-gradient(180deg, #20283a, var(--panel)); }
    .bubble .body { overflow-wrap: anywhere; }
    .bubble p { margin: 0 0 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble .h1 { font-size: 17px; font-weight: 700; margin: 10px 0 4px; }
    .bubble .h2 { font-size: 15px; font-weight: 700; margin: 9px 0 4px; }
    .bubble .h3 { font-size: 13.5px; font-weight: 600; margin: 8px 0 3px; }
    .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
    .bubble li { margin: 2px 0; }
    .bubble blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--border-2); color: var(--muted); }
    .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .bubble a { color: var(--accent); }
    .bubble code { background: var(--panel-3); padding: 1px 5px; border-radius: 5px; font: 12px ui-monospace, Menlo, monospace; }
    .bubble pre.code { background: #0b0f17; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
    .bubble pre.code code { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; }
    .think { display: none; border-left: 2px solid var(--border-2); color: var(--muted); font-style: italic; padding: 2px 0 2px 10px; margin-bottom: 8px; white-space: pre-wrap; }
    .cursor { display: inline-block; width: 8px; height: 15px; margin-left: 2px; vertical-align: -2px; background: var(--accent); border-radius: 1px; animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .eventline { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
    .eventline .ic { opacity: .8; }
    .eventline.err { color: var(--err); }
    .eventline.ok { color: var(--ok); }
    .eventline.plan { color: var(--accent); }
    .eventline.warn { color: var(--warn); }

    .question { border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; background: linear-gradient(180deg, #1a2136, var(--panel)); box-shadow: var(--shadow); }
    .question .qtext { font-weight: 600; margin: 4px 0 8px; }
    .question .qtext p { margin: 0 0 6px; }
    .question .qtext p:last-child { margin-bottom: 0; }
    .question .qtext ul, .question .qtext ol { margin: 4px 0 6px; padding-left: 20px; }
    .question .qtext code { background: var(--panel-3); padding: 1px 5px; border-radius: 5px; font: 12px ui-monospace, Menlo, monospace; }
    .question label { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
    .question label:hover { background: var(--panel-2); }
    .question.answered { opacity: .55; }
    .question input[type=radio] { accent-color: var(--accent); }
    .question .answer-row { display: flex; gap: 8px; margin-top: 8px; }
    .question .answer-row input { flex: 1; }

    /* questionnaire panel */
    #questionnaire { display: none; border-top: 1px solid var(--border); background: rgba(18,23,34,.72);
      max-height: 42vh; overflow: auto; padding: 12px 24px; }
    #questionnaire.show { display: block; }
    .qa-card { max-width: 900px; margin: 0 auto; border: 1px solid var(--accent); border-radius: 8px;
      background: var(--panel); padding: 12px 14px; box-shadow: var(--shadow); }
    .qa-head { margin-bottom: 6px; }
    .qa-item { padding: 9px 0; border-top: 1px dashed var(--border); }
    .qa-item:first-of-type { border-top: none; }
    .qa-q { font-weight: 600; margin-bottom: 6px; }
    .qa-q p { margin: 0 0 4px; }
    .qa-q p:last-child { margin-bottom: 0; }
    .qa-item .opt { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
    .qa-item .opt:hover { background: var(--panel-2); }
    .qa-item input[type=radio] { accent-color: var(--accent); }
    .qa-custom { margin-top: 6px; }
    .qa-foot { margin-top: 10px; display: flex; justify-content: flex-end; }

    /* composer */
    .composer { border-top: 1px solid var(--border); background: rgba(14,18,25,.85); backdrop-filter: blur(8px);
      padding: 14px 24px 16px; display: none; }
    .composer.show { display: block; }
    .composer-box { max-width: 900px; margin: 0 auto; border: 1px solid var(--border); border-radius: 10px;
      background: var(--panel); padding: 8px 8px 6px 8px; transition: border-color .15s, box-shadow .15s; }
    .composer-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,140,255,.14); }
    .composer-box textarea { width: 100%; resize: none; min-height: 28px; max-height: 200px; background: transparent;
      color: var(--text); border: none; outline: none; padding: 6px 8px; font: inherit; }
    .composer-foot { display: flex; align-items: center; gap: 8px; padding: 2px 4px 0; }
    .composer-foot .hint { font-size: 11px; color: var(--muted-2); }
    .composer-foot .grow { flex: 1; }
    button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 13px; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 6px;
      transition: border-color .15s, background .15s, transform .05s; }
    button:hover { border-color: var(--border-2); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: linear-gradient(180deg, var(--accent), #6a7bff); color: #0a0c11; border-color: transparent; font-weight: 700; }
    button.primary:disabled { background: var(--panel-3); color: var(--muted); }
    button.danger:hover { border-color: var(--err); color: var(--err); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(4,6,10,.6); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--panel); border: 1px solid var(--border-2); border-radius: 10px; padding: 18px 20px;
      box-shadow: var(--shadow); max-width: 360px; }
    .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    input:not([type]) { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; font: inherit; width: 100%; outline: none; }
    input:focus { border-color: var(--accent); }
    .row { display: flex; gap: 8px; }
    .muted { color: var(--muted); }
    .ok { color: var(--ok); } .err { color: var(--err); } .warn { color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <span class="brand">conclave agent</span>
    <span class="stat"><span id="agent-dot" class="dot"></span>agent</span>
    <span class="stat"><span id="client-dot" class="dot"></span>client</span>
    <span class="stat" id="device"></span>
    <span class="stat" id="workspace"></span>
    <span class="stat" style="margin-left:auto" id="tools-count"></span>
  </header>

  <div class="layout">
    <aside>
      <div class="pad">
        <div class="row">
          <input id="new-title" placeholder="New session title…" />
          <button class="primary" onclick="createSession()" title="Create session">+</button>
        </div>
      </div>
      <div class="sessions" id="sessions"></div>
    </aside>

    <main>
      <div id="plan"></div>
      <div id="timeline"><div class="empty">Select or create a session.</div></div>
      <div id="questionnaire"></div>
      <div class="composer" id="composer-wrap">
        <div class="composer-box">
          <textarea id="composer" rows="1" placeholder="Describe a task, answer, or send a follow-up…"></textarea>
          <div class="composer-foot">
            <span class="hint">Enter — send · Shift+Enter — newline</span>
            <span class="grow"></span>
            <button id="stop-btn" class="danger" hidden onclick="stopWork()" title="Stop all work in this dialogue">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="10" height="10" rx="2" fill="currentColor"/></svg>
              Stop
            </button>
            <button id="send-btn" class="primary" disabled onclick="sendMessage()" title="Send to the session controller">
              Send
              <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-7-8-3z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

<script>
const state = {
  sessions: [], current: '', es: null,
  deltaEntries: {}, openQuestions: [],
  plan: { nodes: [], edges: [], version: undefined, focus: null, view: { x: 0, y: 0, k: 1 } },
  drag: null, busy: false,
};

async function api(path, opts) {
  const res = await fetch(path, opts);
  const ct = res.headers.get('Content-Type') || '';
  const data = ct.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}

// --- status / sessions ---
async function refreshStatus() {
  try {
    const s = await api('/api/status');
    document.getElementById('device').textContent = 'device ' + (s.device_id || '').slice(0, 8);
    document.getElementById('workspace').textContent = 'ws ' + (s.workspace || '');
    document.getElementById('tools-count').textContent = ((s.tools || []).length) + ' tools';
    document.getElementById('agent-dot').className = 'dot ' + (s.agent_connected ? 'ok' : 'err');
    document.getElementById('client-dot').className = 'dot ' + (s.client_connected ? 'ok' : 'err');
  } catch (e) { /* ignore */ }
}

async function refreshSessions() {
  try { state.sessions = await api('/api/sessions'); renderSessions(); } catch (e) { /* ignore */ }
}

function renderSessions() {
  const el = document.getElementById('sessions');
  el.innerHTML = '';
  if (!state.sessions || !state.sessions.length) { el.innerHTML = '<div class="muted" style="padding:8px">No sessions.</div>'; return; }
  for (const s of state.sessions) {
    const d = document.createElement('div');
    d.className = 'session' + (s.id === state.current ? ' active' : '');
    d.dataset.id = s.id;
    d.innerHTML = `<div class="title-row"><div class="title">${escapeHtml(s.title || 'Untitled')}</div>
        <button class="del" type="button" title="Delete dialogue" data-id="${escapeAttr(s.id)}">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 9zm4 2v8h2v-8H10zm4 0v8h2v-8h-2z"/></svg>
        </button></div>
      <div class="sub"><span class="badge ${escapeAttr(s.status || '')}">${escapeHtml(s.status || '')}</span></div>`;
    el.appendChild(d);
  }
}

// Delegated clicks for the session list (document-level, robust to re-render).
function initSessionList() {
  document.addEventListener('click', (e) => {
    const del = e.target.closest && e.target.closest('.del');
    if (del) {
      e.stopPropagation();
      e.preventDefault();
      const id = del.dataset.id || (del.closest('.session') && del.closest('.session').dataset.id);
      console.log('[conclave-ui] delete click', id);
      if (id) deleteSession(id);
      return;
    }
    const card = e.target.closest && e.target.closest('.session');
    if (card && card.dataset.id) openSession(card.dataset.id);
  });
  console.log('[conclave-ui] session list ready');
}

async function createSession() {
  const title = document.getElementById('new-title').value.trim();
  try {
    const s = await api('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
    document.getElementById('new-title').value = '';
    await refreshSessions();
    openSession(s.id);
  } catch (e) { alert(e.message); }
}

async function openSession(id) {
  state.current = id;
  state.deltaEntries = {};
  state.openQuestions = [];
  renderQuestionnaire();
  state.plan = { nodes: [], edges: [], version: undefined, focus: null, view: { x: 0, y: 0, k: 1 } };
  clearPlan();
  renderSessions();
  setComposerVisible(true);
  setBusy(false);
  updateSendState();
  const tl = document.getElementById('timeline');
  tl.innerHTML = '<div class="empty">Loading…</div>';
  try { await api(`/api/sessions/${id}/open`, { method: 'POST' }); } catch (e) { console.warn(e); }
  try {
    const view = await api(`/api/sessions/${id}/timeline`);
    renderTimeline(view);
  } catch (e) {
    tl.innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
  }
  refreshBusy();
}

function renderTimeline(view) {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  if (view.plan) renderPlan(view.plan.nodes, view.plan.edges, view.plan.plan); else clearPlan();
  for (const ev of (view.events || [])) addEvent(ev);
  for (const a of (view.artifacts || [])) addArtifact(a);
  setOpenQuestions(view.questions || []);
  scrollBottom(true);
}

function setOpenQuestions(questions) {
  state.openQuestions = (questions || []).filter(q => q.state === 'open');
  renderQuestionnaire();
}

// ============ plan graph ============
function keyOf(n) { return n.key || n.id; }

function renderPlan(nodes, edges, plan) {
  state.plan.nodes = nodes || [];
  state.plan.edges = edges || [];
  state.plan.version = plan && plan.version;
  // keep focus only if it still exists
  if (state.plan.focus && !state.plan.nodes.some(n => keyOf(n) === state.plan.focus)) state.plan.focus = null;
  drawPlan();
}

function clearPlan() {
  const el = document.getElementById('plan');
  if (el) { el.innerHTML = ''; el.style.display = 'none'; }
  state.plan.nodes = []; state.plan.edges = [];
}

async function refreshPlan() {
  if (!state.current) return;
  try {
    const view = await api(`/api/sessions/${state.current}/plan`);
    renderPlan(view.nodes, view.edges, view.plan);
  } catch (e) { clearPlan(); }
}

function focusNode(k) { state.plan.focus = (state.plan.focus === k) ? null : k; state.plan.view = { x: 0, y: 0, k: 1 }; drawPlan(); }
function unfocus() { state.plan.focus = null; state.plan.view = { x: 0, y: 0, k: 1 }; drawPlan(); }
function zoomBy(f) { state.plan.view.k = Math.min(2.8, Math.max(0.3, state.plan.view.k * f)); applyView(); }
function fitView() { state.plan.view = { x: 0, y: 0, k: 1 }; applyView(); }

function drawPlan() {
  const el = document.getElementById('plan');
  const all = state.plan.nodes || [];
  if (!all.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'block';

  const byKey = new Map(all.map(n => [keyOf(n), n]));
  const edges = state.plan.edges || [];
  let nodes = all, viewEdges = edges;
  if (state.plan.focus && byKey.has(state.plan.focus)) {
    const f = state.plan.focus, keep = new Set([f]);
    for (const e of edges) { if (e.from === f) keep.add(e.to); if (e.to === f) keep.add(e.from); }
    nodes = all.filter(n => keep.has(keyOf(n)));
    viewEdges = edges.filter(e => keep.has(e.from) && keep.has(e.to));
  }

  // layered layout
  const indeg = {}, adj = {};
  nodes.forEach(n => { const k = keyOf(n); indeg[k] = 0; adj[k] = []; });
  for (const e of viewEdges) { if (adj[e.from] && indeg[e.to] !== undefined) { adj[e.from].push(e.to); indeg[e.to]++; } }
  const level = {};
  const q = nodes.filter(n => indeg[keyOf(n)] === 0).map(n => keyOf(n));
  q.forEach(k => level[k] = 0);
  const queue = q.slice();
  while (queue.length) {
    const k = queue.shift();
    for (const t of adj[k] || []) { level[t] = Math.max(level[t] === undefined ? 0 : level[t], level[k] + 1); if (--indeg[t] === 0) queue.push(t); }
  }
  nodes.forEach(n => { const k = keyOf(n); if (level[k] === undefined) level[k] = 0; });

  const byLevel = {};
  for (const n of nodes) { const l = level[keyOf(n)]; (byLevel[l] = byLevel[l] || []).push(n); }
  const levels = Object.keys(byLevel).map(Number).sort((a, b) => a - b);

  const R = 42, gapX = 150, gapY = 34, pad = 60, rowH = R * 2 + 26;
  let maxRows = 1, maxLevel = 0;
  for (const l of levels) { maxRows = Math.max(maxRows, byLevel[l].length); maxLevel = Math.max(maxLevel, l); }
  const W = pad * 2 + (maxLevel + 1) * (R * 2) + maxLevel * gapX;
  const H = pad * 2 + maxRows * rowH + (maxRows - 1) * gapY;

  const pos = {};
  for (const l of levels) {
    const col = byLevel[l];
    const totalH = col.length * rowH + (col.length - 1) * gapY;
    const y0 = (H - totalH) / 2;
    col.forEach((n, i) => { pos[keyOf(n)] = { x: pad + R + l * (R * 2 + gapX), y: y0 + R + i * (rowH + gapY) }; });
  }

  let svg = `<svg id="graphsvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6a8c"/></marker></defs>
    <g id="vp" transform="translate(${state.plan.view.x},${state.plan.view.y}) scale(${state.plan.view.k})">`;

  for (const e of viewEdges) {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const sx = a.x + dx / d * (R + 2), sy = a.y + dy / d * (R + 2);
    const ex = b.x - dx / d * (R + 10), ey = b.y - dy / d * (R + 10);
    const mx = (sx + ex) / 2 - dy * 0.12, my = (sy + ey) / 2 + dx * 0.12;
    const hot = state.plan.focus && (e.from === state.plan.focus || e.to === state.plan.focus);
    svg += `<path class="edge ${e.kind === 'data' ? 'data' : ''} ${hot ? 'hot' : ''}" d="M${sx},${sy} Q${mx},${my} ${ex},${ey}" marker-end="url(#arrow)"/>`;
  }

  for (const n of nodes) {
    const p = pos[keyOf(n)], st = n.state || 'pending', k = keyOf(n);
    const name = n.title || n.playbook_id || n.role_id || k;
    const sub = ((name !== k) ? k + ' · ' : '') + (n.grade ? n.grade + ' · ' : '') + st;
    const spin = st === 'running' ? `<circle class="spin" cx="${p.x}" cy="${p.y}" r="${R + 7}"/>` : '';
    svg += `<g class="node ${escapeAttr(st)} ${state.plan.focus === k ? 'focus' : ''}" data-key="${escapeAttr(k)}">
      <title>${escapeHtml(name + (n.prompt ? ' — ' + n.prompt : ''))}</title>
      ${spin}
      <circle class="body" cx="${p.x}" cy="${p.y}" r="${R}"/>
      <text class="k" x="${p.x}" y="${p.y + 4}">${escapeHtml(truncate(name, 14))}</text>
      <text class="s" x="${p.x}" y="${p.y + R + 16}">${escapeHtml(truncate(sub, 20))}</text>
    </g>`;
  }
  svg += '</g></svg>';

  const focusNodeData = state.plan.focus ? byKey.get(state.plan.focus) : null;
  let details = '';
  if (focusNodeData) {
    const n = focusNodeData;
    details = `<div class="node-details">
      <div class="row" style="align-items:center">
        <b>${escapeHtml(n.title || n.playbook_id || n.role_id || keyOf(n))}</b>
        <span class="badge ${escapeAttr(n.state || '')}">${escapeHtml(n.state || '')}</span>
        <span class="muted">${escapeHtml(keyOf(n))} · ${escapeHtml(n.kind || '')}${n.grade ? ' / ' + escapeHtml(n.grade) : ''}</span>
        <span class="spacer" style="flex:1"></span>
        <button onclick="unfocus()">← Full graph</button>
      </div>
      ${n.prompt ? `<div class="muted" style="margin-top:6px">prompt: ${escapeHtml(n.prompt)}</div>` : ''}
      ${n.output ? `<pre class="code">${escapeHtml(n.output)}</pre>` : ''}
    </div>`;
  }

  const focusName = focusNodeData ? (focusNodeData.title || focusNodeData.playbook_id || focusNodeData.role_id || keyOf(focusNodeData)) : '';
  el.innerHTML = `<div class="plan-head">
      <span class="muted">plan${state.plan.version ? ' v' + state.plan.version : ''} · ${nodes.length} nodes · ${viewEdges.length} edges${focusName ? ' · focus ' + escapeHtml(focusName) : ''}</span>
      <span class="spacer"></span>
      ${state.plan.focus ? `<button onclick="unfocus()">Full graph</button>` : ''}
      <button onclick="zoomBy(1.2)">+</button>
      <button onclick="zoomBy(0.83)">−</button>
      <button onclick="fitView()">Fit</button>
    </div>
    <div class="graph-wrap">${svg}</div>${details}`;

  attachGraph();
}

function applyView() {
  const vp = document.getElementById('vp');
  if (vp) vp.setAttribute('transform', `translate(${state.plan.view.x},${state.plan.view.y}) scale(${state.plan.view.k})`);
}

function attachGraph() {
  const svg = document.getElementById('graphsvg');
  if (!svg) return;
  svg.addEventListener('pointerdown', (e) => {
    svg.setPointerCapture(e.pointerId);
    state.drag = { x: e.clientX, y: e.clientY, ox: state.plan.view.x, oy: state.plan.view.y, moved: false };
  });
  svg.addEventListener('pointermove', (e) => {
    if (!state.drag) return;
    const dx = e.clientX - state.drag.x, dy = e.clientY - state.drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) state.drag.moved = true;
    if (state.drag.moved) { state.plan.view.x = state.drag.ox + dx; state.plan.view.y = state.drag.oy + dy; applyView(); }
  });
  svg.addEventListener('pointerup', (e) => {
    const moved = state.drag && state.drag.moved; state.drag = null;
    if (moved) return;
    const g = e.target.closest('.node');
    if (g) focusNode(g.dataset.key);
    else if (state.plan.focus) unfocus();
  });
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    state.plan.view.k = Math.min(2.8, Math.max(0.3, state.plan.view.k * (e.deltaY < 0 ? 1.15 : 0.87)));
    applyView();
  }, { passive: false });
}

// ============ live events ============
function connectEvents() {
  if (state.es) state.es.close();
  const es = new EventSource('/api/events');
  state.es = es;
  es.onmessage = (e) => {
    let env; try { env = JSON.parse(e.data); } catch { return; }
    if (!state.current) return;
    if (env.session_id && env.session_id !== state.current) return;
    handleEnvelope(env);
  };
  es.onerror = () => { /* auto-reconnect */ };
}

function handleEnvelope(env) {
  switch (env.type) {
    case 'event': addEvent(env.event); break;
    case 'plan.snapshot': if (env.data && env.data.nodes) renderPlan(env.data.nodes, env.data.edges, env.data.plan); break;
    case 'question.asked': refreshQuestions(); break;
    case 'question.answered': refreshQuestions(); break;
    case 'message.delta': handleDelta(env.data || {}); break;
    default: break;
  }
}

function handleDelta(d) {
  if (!d.message_id) return;
  setBusy(true);
  let el = state.deltaEntries[d.message_id];
  if (!el) {
    el = document.createElement('div');
    el.className = 'entry assistant streaming';
    el.innerHTML = `<div class="meta"></div><div class="bubble"><div class="think"></div><div class="body"></div></div>`;
    document.getElementById('timeline').appendChild(el);
    state.deltaEntries[d.message_id] = el;
  }
  el.querySelector('.meta').innerHTML = `<span>${escapeHtml(d.role || 'assistant')}</span>${d.model ? `<span class="pill">${escapeHtml(d.model)}</span>` : ''}${d.node_id ? `<span class="pill">${escapeHtml(d.node_id)}</span>` : ''}`;
  if (d.reasoning) { const th = el.querySelector('.think'); th.style.display = 'block'; th.textContent = d.reasoning; }
  el.querySelector('.body').innerHTML = renderMarkdown(d.text || '') + (d.final ? '' : '<span class="cursor"></span>');
  if (d.final) el.classList.remove('streaming');
  scrollBottomIfNear();
}

function addEvent(ev) {
  if (!ev) return;
  if (ev.type === 'user.message') { addEntry({ kind: 'user', text: (ev.payload && ev.payload.content) || ev.message }); return; }
  if (ev.type === 'message.created') {
    const p = ev.payload || {};
    const el = p.message_id && state.deltaEntries[p.message_id];
    if (el) { el.classList.remove('streaming'); el.querySelector('.body').innerHTML = renderMarkdown(p.content || ''); }
    else addEntry({ kind: 'assistant', role: p.role, model: p.model, text: p.content });
    return;
  }
  if (ev.type === 'artifact.created') { if (ev.payload) addArtifact(ev.payload); return; }
  if (ev.type === 'critic.verdict') { addEntry({ kind: 'event', cls: 'warn', ic: '⚖', text: 'critic: ' + ((ev.payload && ev.payload.feedback) || JSON.stringify(ev.payload || {})) }); return; }
  if (ev.type === 'error') { addEntry({ kind: 'event', cls: 'err', ic: '!', text: ev.message || (ev.payload && ev.payload.error) || 'error' }); return; }
  if (ev.type === 'job.failed') { const p = ev.payload || {}; addEntry({ kind: 'event', cls: 'err', ic: '✕', text: `${p.kind || 'job'} failed: ${p.error || ev.message || ''}` }); refreshBusy(); return; }
  if (ev.type === 'session.done') { addEntry({ kind: 'event', cls: 'ok', ic: '✓', text: 'session finished' }); refreshBusy(); return; }
  if (ev.type === 'plan.created' || ev.type === 'plan.revised' || ev.type === 'plan.done') { refreshPlan(); return; }
  if (ev.type === 'node.state_changed') { const p = ev.payload || {}; addEntry({ kind: 'event', cls: p.state === 'failed' ? 'err' : 'plan', ic: '◆', text: `${p.title || p.role || p.key || p.node_id || 'node'} → ${p.state || ''}${p.error ? ': ' + p.error : ''}` }); refreshPlan(); return; }
  if (ev.type === 'question.asked') { refreshQuestions(); return; }
  if (ev.type === 'playbook.started' || ev.type === 'playbook.finished' || ev.type === 'playbook.failed') {
    const p = ev.payload || {};
    const failed = ev.type === 'playbook.failed';
    addEntry({ kind: 'event', ic: '▶', cls: failed ? 'err' : '', text: `${p.playbook || ev.type}${p.version ? ' v' + p.version : ''}${failed && p.error ? ': ' + p.error : ''}` });
    refreshPlan(); return;
  }
  if (ev.type === 'task.started' || ev.type === 'task.finished') { const p = ev.payload || {}; addEntry({ kind: 'event', ic: '·', text: `task ${p.tier || ''} ${ev.type === 'task.started' ? 'started' : 'done'}` }); return; }
  if (ev.type === 'job.queued') { setBusy(true); addEntry({ kind: 'event', ic: '⏳', text: `job queued${ev.payload && ev.payload.kind ? ' (' + ev.payload.kind + ')' : ''}` }); return; }
  if (ev.type === 'job.done') { refreshPlan(); refreshBusy(); return; }
}

function addArtifact(a) { if (a && a.name) addEntry({ kind: 'event', cls: 'ok', ic: '📄', text: `artifact ${a.name}` }); }

function addEntry(o) {
  const tl = document.getElementById('timeline');
  const d = document.createElement('div');
  d.className = 'entry ' + (o.kind || '');
  if (o.kind === 'assistant') {
    d.innerHTML = `<div class="meta"><span>${escapeHtml(o.role || '')}</span>${o.model ? `<span class="pill">${escapeHtml(o.model)}</span>` : ''}</div><div class="bubble"><div class="body">${renderMarkdown(o.text || '')}</div></div>`;
  } else if (o.kind === 'user') {
    d.innerHTML = `<div class="meta">you</div><div class="bubble"><div class="body">${renderMarkdown(o.text || '')}</div></div>`;
  } else {
    d.innerHTML = `<div class="eventline ${o.cls || ''}"><span class="ic">${o.ic || '•'}</span><span>${escapeHtml(o.text || '')}</span></div>`;
  }
  tl.appendChild(d);
  scrollBottomIfNear();
}

// formatQuestionText adds line breaks before inline enumerations like "(1)".
function formatQuestionText(s) {
  s = String(s || '').trim();
  if (!s || s.indexOf('\n') >= 0) return s;
  return s.replace(/\s*\((\d{1,2})\)\s*/g, '\n($1) ').replace(/\s+(\d{1,2})\)\s+/g, '\n$1) ').trim();
}

// renderQuestionnaire shows all open questions as one form with a single submit.
function renderQuestionnaire() {
  const el = document.getElementById('questionnaire');
  if (!el) return;
  const qs = state.openQuestions || [];
  if (!qs.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  const items = qs.map(q => {
    const id = escapeAttr(q.id);
    const opts = (q.options || []).map(o =>
      `<label class="opt"><input type="radio" name="qa_${id}" value="${escapeAttr(o.label)}"> <span>${escapeHtml(o.label)}</span>${o.recommended ? ' <span class="muted">· recommended</span>' : ''}</label>`).join('');
    return `<div class="qa-item" data-qid="${id}">
      <div class="qa-q">${renderMarkdown(formatQuestionText(q.text || q.question || ''))}</div>
      ${opts}
      <input class="qa-custom" placeholder="or your own answer…">
    </div>`;
  }).join('');
  el.classList.add('show');
  el.innerHTML = `<div class="qa-card">
    <div class="qa-head"><b>${qs.length} ${qs.length === 1 ? 'question' : 'questions'}</b> <span class="muted">— answer and submit once</span></div>
    ${items}
    <div class="qa-foot"><button class="primary" onclick="submitQuestionnaire()">Submit answers</button></div>
  </div>`;
}

async function refreshQuestions() {
  if (!state.current) return;
  try {
    const qs = await api(`/api/sessions/${state.current}/questions`);
    setOpenQuestions(qs || []);
  } catch (e) { /* ignore */ }
}

async function submitQuestionnaire() {
  const id = state.current;
  if (!id) return;
  const card = document.querySelector('#questionnaire .qa-card');
  if (!card) return;
  const answers = [];
  let missing = false;
  card.querySelectorAll('.qa-item').forEach(it => {
    const qid = it.dataset.qid;
    const sel = it.querySelector('input[type=radio]:checked');
    const custom = (it.querySelector('.qa-custom') || {}).value || '';
    if (!sel && !custom.trim()) missing = true;
    answers.push({ question_id: qid, selected: sel ? [sel.value] : [], custom });
  });
  if (missing) { alert('Please answer every question (pick an option or type your own).'); return; }
  try {
    await api(`/api/sessions/${id}/answers`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers }) });
    state.openQuestions = [];
    renderQuestionnaire();
    setBusy(true);
  } catch (e) { alert(e.message); }
}

// --- composer ---
async function sendMessage() {
  const ta = document.getElementById('composer');
  const content = ta.value.trim();
  if (!content || !state.current) return;
  try {
    await api(`/api/sessions/${state.current}/message`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) });
    ta.value = ''; ta.style.height = 'auto'; updateSendState(); setBusy(true);
  } catch (e) { alert(e.message); }
}
// stopWork cancels all active jobs of the current dialogue.
async function stopWork() {
  if (!state.current) return;
  try { await api(`/api/sessions/${state.current}/interrupt`, { method: 'POST' }); } catch (e) { alert(e.message); }
  await refreshBusy();
}

// uiConfirm is a non-blocking, in-page confirm (native confirm() may be
// suppressed by the browser, which made delete look like a no-op).
function uiConfirm(message, onYes) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal"><div>${escapeHtml(message)}</div>
    <div class="modal-actions"><button data-no>Cancel</button><button class="primary" data-yes>Delete</button></div></div>`;
  ov.addEventListener('click', (e) => {
    if (e.target === ov || e.target.hasAttribute('data-no')) { ov.remove(); }
    else if (e.target.hasAttribute('data-yes')) { ov.remove(); onYes(); }
  });
  document.body.appendChild(ov);
}

async function deleteSession(id) {
  uiConfirm('Delete this dialogue and all its data?', async () => {
    try { await api(`/api/sessions/${id}`, { method: 'DELETE' }); } catch (e) { alert(e.message); return; }
    if (state.current === id) resetView();
    await refreshSessions();
  });
}

function resetView() {
  state.current = '';
  state.deltaEntries = {};
  state.openQuestions = [];
  renderQuestionnaire();
  state.plan = { nodes: [], edges: [], version: undefined, focus: null, view: { x: 0, y: 0, k: 1 } };
  clearPlan();
  setComposerVisible(false);
  setBusy(false);
  document.getElementById('timeline').innerHTML = '<div class="empty">Select or create a session.</div>';
  renderSessions();
}

// --- composer controls ---
function setComposerVisible(v) { const el = document.getElementById('composer-wrap'); if (el) el.classList.toggle('show', v); }
function setBusy(b) { state.busy = b; const btn = document.getElementById('stop-btn'); if (btn) btn.hidden = !b; }
function updateSendState() {
  const ta = document.getElementById('composer'), btn = document.getElementById('send-btn');
  if (!ta || !btn) return;
  btn.disabled = !state.current || !ta.value.trim();
}
async function refreshBusy() {
  if (!state.current) { setBusy(false); return; }
  try {
    const jobs = await api(`/api/sessions/${state.current}/jobs`);
    setBusy((jobs || []).some(j => j.state === 'queued' || j.state === 'leased'));
  } catch (e) { setBusy(false); }
}

// --- helpers ---
function isNearBottom() { const tl = document.getElementById('timeline'); return tl.scrollHeight - tl.scrollTop - tl.clientHeight < 160; }
function scrollBottomIfNear() { if (isNearBottom()) scrollBottom(); }
function scrollBottom(force) { const tl = document.getElementById('timeline'); if (force || isNearBottom()) tl.scrollTop = tl.scrollHeight; }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escapeAttr(s) { return escapeHtml(s); }
function truncate(s, n) { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

// --- markdown ---
function inlineMd(s) {
  let h = escapeHtml(s);
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\n/g, '<br>');
  return h;
}

function renderMarkdown(src) {
  const lines = String(src || '').replace(/\r\n/g, '\n').split('\n');
  let html = '', list = null, i = 0;
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^\s*```(.*)$/);
    if (fence) {
      const code = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++; closeList();
      html += `<pre class="code"><code>${escapeHtml(code.join('\n'))}</code></pre>`;
      continue;
    }
    if (/^\s*$/.test(line)) { closeList(); i++; continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { closeList(); const lvl = Math.min(m[1].length, 3); html += `<div class="h${lvl}">${inlineMd(m[2])}</div>`; i++; continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += `<li>${inlineMd(m[1])}</li>`; i++; continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += `<li>${inlineMd(m[1])}</li>`; i++; continue; }
    if ((m = line.match(/^>\s?(.*)$/))) { closeList(); html += `<blockquote>${inlineMd(m[1])}</blockquote>`; i++; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { closeList(); html += '<hr>'; i++; continue; }
    closeList();
    const para = [line]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|>\s|```|\s*[-*+]\s|\s*\d+[.)]\s)/.test(lines[i])) { para.push(lines[i]); i++; }
    html += `<p>${inlineMd(para.join('\n'))}</p>`;
  }
  closeList();
  return html || '<span class="muted">…</span>';
}

document.getElementById('composer').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
document.getElementById('composer').addEventListener('input', (e) => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 200) + 'px'; updateSendState(); });

refreshStatus(); refreshSessions(); connectEvents(); initSessionList();
setInterval(refreshStatus, 3000);
setInterval(refreshSessions, 10000);
setInterval(() => { if (state.current) refreshBusy(); }, 2500);
</script>
