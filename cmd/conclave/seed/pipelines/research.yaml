description: "Controller-driven research: the lead decides when research is sufficient, then writes a brief."
inputs: [task]
settings:
  max_parallel: 3
  outputs: [brief.md]
nodes:
  - id: lead
    type: supervisor
    role: controller
    prompt: >-
      Research the task. Delegate investigation to the researcher, then have the
      critic review the findings (use delegate_parallel to run them together when
      useful). Iterate until the research is solid and well sourced, then have
      the tech_writer produce a concise brief and call finish.
    max_steps: 8
    roles: [researcher, critic, tech_writer]
    output: brief.md
