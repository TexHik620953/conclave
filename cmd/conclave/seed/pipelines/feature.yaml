description: "Controller-driven feature delivery: the lead plans, implements, reviews and fixes until approved."
inputs: [task]
settings:
  max_parallel: 4
  outputs: [summary.md]
nodes:
  - id: lead
    type: supervisor
    role: controller
    prompt: >-
      Deliver the task end to end. Delegate a concrete plan to the architect,
      then implementation to the senior. Review the result with the qa,
      security_reviewer and devops in parallel. When a review reports issues,
      delegate the fixes back to the senior and review again. Iterate until the
      reviews pass, then have the tech_writer summarize what changed and any
      remaining risks, and call finish.
    max_steps: 16
    roles: [architect, senior, middle, junior, qa, security_reviewer, devops, tech_writer]
    output: summary.md
