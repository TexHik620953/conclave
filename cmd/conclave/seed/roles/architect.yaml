id: architect
title: "Solution Architect"
description: "Turns a task into a concrete, reviewable plan."
model: openai/gpt-4o
fallback: ["openrouter/anthropic/claude-3.5-sonnet", "ollama/qwen2.5-coder:7b"]
prompt_file: prompts/architect.md
temperature: 0.2
tools: [read_file, list_dir, glob, grep, web_search, ask_user]
permissions:
  fs_read: true
  fs_write: false
  shell: false
  network: true
outputs: [plan.md]
